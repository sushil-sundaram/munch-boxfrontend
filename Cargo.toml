[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
yew = { version = "0.21", features = ["csr"] }
gloo-storage = "0.3.0"
gloo-net = "0.6"
wasm-bindgen-futures = "0.4"
uuid = { version = "1.8", features = ["v4", "js"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement"] }
serde_json = "1.0"