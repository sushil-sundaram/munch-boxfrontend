<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MunchBox</title>
    <link data-trunk rel="rust" data-bin="frontend" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f0eb;
            color: #2d2a26;
            min-height: 100vh;
        }
        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 1.25rem;
            background: #ff6b35;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .header-emoji { font-size: 1.5rem; }
        .content {
            flex: 1;
            padding: 1.5rem 1.25rem;
        }
        .content h2 { margin-bottom: 0.5rem; }
        .content p { color: #666; }
        .nav {
            display: flex;
            border-top: 1px solid #e8e4df;
            background: #faf8f6;
        }
        .nav button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.75rem 0.5rem;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.75rem;
            color: #888;
        }
        .nav button.active { color: #ff6b35; font-weight: 600; }
        .nav button span:first-child { font-size: 1.25rem; }
    </style>
</head>
<body></body>
</html>
