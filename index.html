<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MunchBox - Meal Planner & Recipe Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 600px;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            border-left: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
        }

        .header {
            padding: 1rem 1.25rem;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #6366f1;
        }

        .header-logo {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: #f8fafc;
        }

        .ui-icon {
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            color: #818cf8;
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .content {
            flex: 1;
            padding: 1.25rem;
            padding-bottom: 5rem;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 1.25rem;
            letter-spacing: -0.01em;
        }

        /* Bottom Nav */
        .nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 600px;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 0.6rem 0;
            z-index: 100;
        }

        .nav button {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .nav button:hover {
            color: #f8fafc;
            background-color: #334155;
        }

        .nav button.active {
            color: #6366f1;
            background-color: #334155;
        }

        /* Generic Inputs & Forms */
        input[type="text"], input[type="number"], input[type="url"], select, textarea {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.55rem 0.75rem;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #6366f1;
        }

        /* Toast Notification */
        .toast-notification {
            background-color: #1e293b;
            border: 1px solid #6366f1;
            color: #818cf8;
            padding: 0.65rem 0.85rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        /* Recipe Book Styles */
        .recipe-book-container { display: flex; flex-direction: column; gap: 1rem; }
        .recipe-header-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
        
        button {
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 4px;
            padding: 0.55rem 0.85rem;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .btn-toggle-url, .btn-toggle-form {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
        }
        .btn-toggle-url:hover, .btn-toggle-form:hover {
            background-color: #334155;
        }

        .url-scrape-form, .recipe-form {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .url-scrape-form h3, .recipe-form h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .scrape-help {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .url-input-row { display: flex; gap: 0.5rem; }
        .url-input-row input { flex: 1; }

        .btn-scrape, .btn-save-recipe {
            background-color: #6366f1;
            color: #ffffff;
            border: 1px solid #6366f1;
        }
        .btn-scrape:hover, .btn-save-recipe:hover {
            background-color: #4f46e5;
        }

        .form-row { display: flex; flex-direction: column; gap: 0.3rem; }
        .form-row label { font-size: 0.8rem; font-weight: 600; color: #94a3b8; }
        .flex-1 { flex: 1; }

        .form-section-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6366f1;
            margin-top: 0.4rem;
        }

        .ingredient-row-edit {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background-color: #0f172a;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        .staple-checkbox {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.75rem;
            color: #94a3b8;
            cursor: pointer;
        }

        .btn-remove-row {
            background: none;
            border: 1px solid #dc2626;
            color: #ef4444;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
        }
        .btn-remove-row:hover { background-color: #ef4444; color: #ffffff; }

        .btn-add-row {
            background-color: #0f172a;
            color: #6366f1;
            border: 1px solid #6366f1;
            padding: 0.45rem;
        }
        .btn-add-row:hover { background-color: #1e293b; }

        .recipes-grid { display: flex; flex-direction: column; gap: 0.85rem; }
        
        .recipe-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .card-title-group { flex: 1; display: flex; flex-direction: column; gap: 0.2rem; }
        .card-title { font-size: 1.05rem; font-weight: 700; color: #f8fafc; }

        .btn-delete-recipe {
            background-color: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
        }
        .btn-delete-recipe:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        .star-rating, .star-rating-selector { display: flex; gap: 0.15rem; font-size: 1rem; cursor: pointer; user-select: none; }
        .star { color: #475569; }
        .star.active { color: #f59e0b; }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6366f1;
            font-weight: 700;
        }

        .ingredients-list {
            list-style: none;
            font-size: 0.85rem;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .ingredients-list li { display: flex; align-items: center; gap: 0.4rem; }

        .badge-staple {
            background-color: #334155;
            color: #f59e0b;
            font-size: 0.7rem;
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            font-weight: 600;
        }

        .instructions-text {
            font-size: 0.85rem;
            color: #94a3b8;
            white-space: pre-line;
            line-height: 1.45;
        }

        /* Planner Grid */
        .planner-container { display: flex; flex-direction: column; gap: 1rem; }
        .planner-header-actions { display: flex; justify-content: flex-end; }

        .btn-generate-groceries {
            background-color: #6366f1;
            color: #ffffff;
            border: 1px solid #6366f1;
            padding: 0.6rem 1rem;
        }
        .btn-generate-groceries:hover { background-color: #4f46e5; }

        .planner-grid { display: flex; flex-direction: column; gap: 0.85rem; }
        
        .day-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .day-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.4rem;
        }

        .day-slots { display: flex; flex-direction: column; gap: 0.5rem; }
        .meal-slot { display: flex; align-items: center; gap: 0.6rem; }
        .slot-label { width: 80px; font-size: 0.8rem; font-weight: 600; color: #94a3b8; }
        .meal-slot select { flex: 1; }

        /* Grocery Container */
        .grocery-container { display: flex; flex-direction: column; gap: 1rem; }
        .grocery-header { display: flex; justify-content: flex-between; align-items: center; }
        .sync-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .sync-status {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
        }
        .sync-status.idle { background-color: #334155; color: #cbd5e1; }
        .sync-status.syncing { background-color: #1e3a8a; color: #93c5fd; }
        .sync-status.success { background-color: #064e3b; color: #6ee7b7; }
        .sync-status.error { background-color: #7f1d1d; color: #fca5a5; }

        .btn-sync {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
        }
        .btn-sync:hover { background-color: #334155; }

        .input-row { display: flex; gap: 0.4rem; align-items: center; }
        .btn-add {
            background-color: #6366f1;
            color: #ffffff;
            border: 1px solid #6366f1;
        }
        .btn-add:hover { background-color: #4f46e5; }

        .actions-row { display: flex; justify-content: space-between; gap: 0.5rem; }
        .btn-toggle-staples, .btn-sweep {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            font-size: 0.8rem;
        }
        .btn-toggle-staples:hover, .btn-sweep:hover {
            background-color: #334155;
            color: #f8fafc;
        }

        .grocery-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
        
        .grocery-item {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 0.65rem 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .grocery-item:hover { background-color: #334155; }

        .grocery-item.bought {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .item-info { display: flex; align-items: center; gap: 0.6rem; }
        .item-qty-badge {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
        }
        .item-name { font-size: 0.9rem; color: #f8fafc; }
        .item-checkbox { font-family: monospace; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div id="main"></div>
</body>
</html>
